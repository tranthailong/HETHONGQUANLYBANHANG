services:

  mysql:
    image: mysql:8.0
    container_name: sale_management_mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: sale_management

    ports:
      - "3307:3306"

    # Đã sửa lại vị trí: Đặt command thẳng hàng với ports, environment, volumes...
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/sale_management.sql:/docker-entrypoint-initdb.d/sale_management.sql:ro

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      timeout: 5s
      retries: 10
      interval: 5s
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: hethongquanlybanhang_app
    restart: always

    ports:
      - "8080:8080"

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sale_management?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123

      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"

volumes:
  mysql_data: