<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sản phẩm - Dashboard Bán Hàng</title>
    <!-- Tailwind CSS cho khung -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/products.css">
</head>
<body class="bg-slate-100 font-sans">

<div class="flex h-screen overflow-hidden">
    <!-- Sidebar Dashboard -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col shadow-xl">
        <div class="p-6 text-xl font-bold tracking-wider text-white border-b border-slate-800 flex items-center gap-3">
            <i class="fa-solid fa-store text-blue-500"></i> ADMIN DASHBOARD
        </div>
        <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto">
            <a href="/dashboard" class="flex items-center gap-3 py-3 px-4 rounded-xl hover:bg-slate-800 transition"><i class="fa-solid fa-chart-pie w-5"></i> Tổng quan</a>
            <a href="#" class="flex items-center gap-3 py-3 px-4 rounded-xl hover:bg-slate-800 transition"><i class="fa-solid fa-cash-register w-5"></i> Bán hàng (POS)</a>
            <a href="/products" class="flex items-center gap-3 py-3 px-4 rounded-xl bg-blue-600 text-white font-medium shadow-lg shadow-blue-600/30"><i class="fa-solid fa-box-open w-5"></i> Quản lý Sản phẩm</a>
            <a href="/categories" class="flex items-center gap-3 py-3 px-4 rounded-xl hover:bg-slate-800 transition"><i class="fa-solid fa-warehouse w-5"></i> Kho hàng</a>
            <a href="/customers" class="flex items-center gap-3 py-3 px-4 rounded-xl hover:bg-slate-800 transition"><i class="fa-solid fa-users w-5"></i> Khách hàng</a>
        </nav>
    </aside>

    <!-- Main Workspace -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <!-- Topbar Header -->
        <header class="bg-white h-20 shadow-sm flex items-center justify-between px-8 z-10">
            <div class="flex items-center gap-4 w-96">
                <div class="relative w-full">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-search"></i></span>
                    <input type="text" id="searchInput" placeholder="Tìm kiếm sản phẩm theo tên..." class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 transition">
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <h4 class="text-sm font-bold text-slate-800">Quản trị viên</h4>
                    <span class="text-xs text-slate-500">Super Admin</span>
                </div>
                <div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold shadow-md">AD</div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto p-8">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
                <div>
                    <h1 class="text-2xl font-bold text-slate-800">Danh sách Sản phẩm</h1>
                    <p class="text-sm text-slate-500 mt-1">Quản lý kho hàng, giá bán và thông tin chi tiết sản phẩm hệ thống.</p>
                </div>
                <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-xl flex items-center gap-2 shadow-lg shadow-blue-600/20 transition">
                    <i class="fa-solid fa-plus"></i> Thêm sản phẩm mới
                </button>
            </div>

            <!-- Data Table Card (Đã xóa cột hình ảnh) -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                        <tr class="bg-slate-50/70 border-b border-slate-100 text-slate-500 text-xs font-semibold uppercase tracking-wider">
                            <th class="p-5">ID</th>
                            <th class="p-5">Tên sản phẩm</th>
                            <th class="p-5">Danh mục</th>
                            <th class="p-5">Giá bán</th>
                            <th class="p-5">Tồn kho</th>
                            <th class="p-5 text-center">Hành động</th>
                        </tr>
                        </thead>
                        <tbody id="productTableBody" class="divide-y divide-slate-100 text-sm text-slate-700">
                        <!-- Dữ liệu render tự động -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Modal Form Thêm/Sửa Sản phẩm (Đã ẩn input ảnh đi để form gọn hơn) -->
<div id="productModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white w-full max-w-xl rounded-2xl shadow-2xl overflow-hidden animate-in">
        <div class="flex justify-between items-center bg-slate-50 px-6 py-4 border-b border-slate-100">
            <h3 id="modalTitle" class="font-bold text-lg text-slate-800">Thêm mới sản phẩm</h3>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:bg-slate-200 transition"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form id="productForm" onsubmit="handleFormSubmit(event)">
            <div class="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
                <input type="hidden" id="productId">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tên sản phẩm (*)</label>
                    <input type="text" id="name" required class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition" placeholder="Nhập tên sản phẩm...">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Giá sản phẩm (*)</label>
                        <input type="number" step="0.01" id="price" required class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition" placeholder="0.0">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Số lượng (*)</label>
                        <input type="number" id="quantity" required class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition" placeholder="0">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Danh mục sản phẩm (*)</label>
                    <select id="categoryId" required class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition bg-white">
                        <option value="">-- Chọn danh mục --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Mô tả sản phẩm</label>
                    <textarea id="description" rows="3" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition" placeholder="Nhập mô tả chi tiết..."></textarea>
                </div>
            </div>
            <div class="bg-slate-50 px-6 py-4 flex justify-end gap-3 border-t border-slate-100">
                <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl bg-slate-200 text-slate-700 text-sm font-medium hover:bg-slate-300 transition">Hủy</button>
                <button type="submit" class="px-5 py-2.5 rounded-xl bg-blue-600 text-white text-sm font-medium hover:bg-blue-700 transition shadow-lg shadow-blue-600/20">Lưu thông tin</button>
            </div>
        </form>
    </div>
</div>

<script src="/js/products.js"></script>
</body>
</html>
