spring.application.name=HETHONGQUANLYBANHANG

# Thêm ?useUnicode=true&characterEncoding=UTF-8 để chống lỗi font tiếng Việt ở Database
spring.datasource.url=jdbc:mysql://mysql:3306/sale_management?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root123

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

# Ép toàn bộ phản hồi từ Server sang chuẩn UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true